[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "parser-video"
version = "0.1.0"
description = "Bounded Xiaohongshu and Douyin media direct-link parser API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "curl-cffi==0.13.0",
  "fastapi==0.115.8",
  "pydantic==2.10.6",
  "playwright==1.64.0",
  "uvicorn==0.34.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "jsonschema==4.23.0",
  "mypy==1.15.0",
  "pytest==8.3.4",
  "pytest-asyncio==0.25.3",
  "ruff==0.9.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".trellis", ".codex", ".agents"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
allowed-confusables = ["，"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["app"]
