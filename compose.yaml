services:
  api:
    build:
      context: .
    image: parser-video:0.1.0
    user: "10001:10001"
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    init: true
    mem_limit: 512m
    pids_limit: 256
    security_opt:
      - seccomp=./deploy/chromium-seccomp.json
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).read()"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
